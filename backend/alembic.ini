# Database migrations. The app runs `upgrade head` on startup; the database URL comes from app.config (DATABASE_URL).
#   New migration after changing app/models.py:  .venv/bin/alembic revision --autogenerate -m "what changed"
#   Apply by hand:                                .venv/bin/alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
